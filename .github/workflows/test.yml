name: Tests

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: screenshots change between Ubuntu versions
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # the converter tests (revit-mats-beams) run ifc2reshore.build() on a
      # made-up model, which needs shapely; the IFC stack itself is not needed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install shapely

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run test suite
        run: node tests/run.mjs --fresh
        env:
          RESHORE_JOBS: 4
          RESHORE_BUDGET: 600
          RESHORE_TIMEOUT: 300

      - name: Keep the screenshots that differ from the baselines
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-actual-linux
          path: tests/baselines/linux/actual/
          if-no-files-found: ignore

      - name: Check rule coverage
        run: node tests/rules.mjs
